name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Finesse
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Finesse/dashboard/package-lock.json
      - run: npm ci
        working-directory: Finesse/dashboard
      - run: npm run test:i18n && npm run test:connections && npm run build
        working-directory: Finesse/dashboard

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Finesse
      - uses: actions/checkout@v4
        with:
          repository: HayashiUme/Impostor
          ref: master
          path: Impostor
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build plugin/Impostor/Finesse.Plugin.csproj --configuration Release
        working-directory: Finesse
      - run: dotnet build plugin/Empostor/Finesse.Empostor.Plugin.csproj --configuration Release
        working-directory: Finesse
