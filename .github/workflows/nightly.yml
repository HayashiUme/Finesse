name: Nightly Release

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Finesse
      - uses: actions/checkout@v4
        with:
          repository: HayashiUme/Impostor
          ref: master
          path: Impostor
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Finesse/dashboard/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Read version
        id: version
        working-directory: Finesse
        run: |
          VERSION=$(tr -d '\r\n' < VERSION)
          if [[ "$VERSION" != *-dev* ]]; then echo "VERSION must end in -dev for Nightly builds"; exit 1; fi
          echo "base=$VERSION" >> "$GITHUB_OUTPUT"
          echo "full=$VERSION.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Build dashboard
        working-directory: Finesse/dashboard
        env:
          FINESSE_VERSION: ${{ steps.version.outputs.full }}
        run: npm ci && npm run test:i18n && npm run test:connections && npm run build
      - name: Build plugin
        working-directory: Finesse
        run: dotnet build plugin/Finesse.Plugin.csproj --configuration Release -p:Version='${{ steps.version.outputs.full }}' -p:InformationalVersion='${{ steps.version.outputs.full }}'
      - name: Package release assets
        working-directory: Finesse
        run: |
          mkdir -p package/dashboard
          cp plugin/bin/Release/net10.0/Finesse.Plugin.dll package/Finesse.Plugin.dll
          cp -R dashboard/dist/. package/dashboard/
          printf '{"version":"%s","pluginAsset":"Finesse.Plugin.dll","dashboardAsset":"Finesse-dashboard.zip"}\n' '${{ steps.version.outputs.full }}' > package/Finesse-update.json
          cd package && zip -qr ../Finesse-dashboard.zip dashboard
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.full }}
          name: Nightly ${{ steps.version.outputs.full }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            Finesse/Finesse-dashboard.zip
            Finesse/package/Finesse.Plugin.dll
            Finesse/package/Finesse-update.json
